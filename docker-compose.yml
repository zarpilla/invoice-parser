version: '3.8'

services:
  invoice-parser-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: invoice-parser-api:latest
    container_name: invoice-parser-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-4000}:4000"  # nginx only: Docker publishes ports past UFW (issues/404)
    environment:
      - PORT=4000
      - API_TOKENS=${API_TOKENS}
      - ZAI_API_KEY=${ZAI_API_KEY}
      - ZAI_BASE_URL=${ZAI_BASE_URL:-https://api.z.ai/api/paas/v4/}
      - ZAI_MODEL=${ZAI_MODEL:-glm-5.3-flash}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - invoice-parser-network

networks:
  invoice-parser-network:
    driver: bridge
